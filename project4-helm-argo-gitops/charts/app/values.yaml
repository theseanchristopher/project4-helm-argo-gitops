replicaCount: 2

image:
  # TODO: update this to your real ECR repo from Project 1
  repository: 349821334974.dkr.ecr.us-east-1.amazonaws.com/project1-nginx
  pullPolicy: IfNotPresent

  # Leave tag empty here – dev/prod values files will set it later
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:349821334974:certificate/367fc89f-aac1-4c63-8c1f-814c4ffb530b
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: project4-dev.seanxtopher.com
      paths:
        - path: /
          pathType: Prefix
  tls: []   # we can configure later if needed

httpRoute:
  enabled: false

resources: {}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

nodeSelector: {}
tolerations: []
affinity: {}

