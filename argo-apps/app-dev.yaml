apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project4-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theseanchristopher/project4-helm-argo-gitops.git
    targetRevision: project4-gitops
    path: charts/app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: project3-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

